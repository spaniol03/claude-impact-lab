[project]
name = "creche-impact-lab-backend"
version = "0.1.0"
description = "API do Otimizador de Distribuição de Vagas em Creches — Claude Impact Lab / SME-Rio"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# textos institucionais longos (perguntas do questionário, mensagens ao cidadão)
"app/services/inscricao_sim.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
